<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touch Driver Fixer 設定</title>
    <style>
        :root {
            --bg: #1a1a1e;
            --card-bg: #242429;
            --primary: #2196F3;
            --text: #ffffff;
            --text-sub: #9ea4b0;
            --border: #32323a;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 16px; background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; }
        h2 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; padding-bottom: 6px; border-bottom: 2px solid var(--primary); }
        
        /* 解説とハテナボタンの並び */
        .hint-container { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
        .hint { font-size: 12px; color: var(--text-sub); line-height: 1.4; margin: 0; flex-grow: 1; }
        
        /* まるで囲ったハテナボタン */
        .help-btn { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--text-sub); color: var(--text-sub); font-size: 11px; font-weight: bold; cursor: pointer; user-select: none; flex-shrink: 0; margin-top: 2px; transition: all 0.2s; }
        .help-btn:active { background: rgba(255, 255, 255, 0.1); color: #fff; border-color: #fff; }
        
        /* 説明ボックスの見た目 */
        .help-box { display: none; background: #2f2f36; border-left: 3px solid var(--primary); padding: 10px 12px; border-radius: 4px; margin-bottom: 16px; font-size: 12px; line-height: 1.5; color: #fff; }
        .help-box p { margin: 0 0 6px 0; }
        .help-box p:last-child { margin: 0; }
        .help-box b { color: var(--primary); }

        /* 検索ボックスのコンテナ設定 */
        .search-container { position: relative; width: 100%; margin-bottom: 16px; display: block; }
        .search-box { width: 100%; box-sizing: border-box; padding: 12px 40px 12px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--card-bg); color: #fff; outline: none; display: block; }
        .search-box:focus { border-color: var(--primary); }
        
        /* クリアボタン(×)の見た目 */
        .search-clear { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-sub); font-size: 22px; display: none; user-select: none; padding: 4px; line-height: 1; z-index: 10; }
        .search-clear:hover { color: #fff; }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        #apps-list { display: flex; flex-direction: column; }
        .app-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
        .app-item:last-child { border-bottom: none; }
        .app-info { display: flex; flex-direction: column; min-width: 0; flex-grow: 1; margin-right: 16px; }
        .label { font-weight: 600; font-size: 15px; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pkg-name { font-size: 11px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: monospace; margin-top: 2px; }
        select { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: #2f2f36; font-size: 13px; color: #fff; font-weight: 600; outline: none; cursor: pointer; }
        select:focus { border-color: var(--primary); }
    </style>
</head>
<body>

    <h2>Touch Driver Fixer 設定</h2>
    
    <div class="hint-container">
        <p class="hint">未設定のアプリ、および一覧にないシステムコアは自動的に<b>「高速モード」</b>で動作します。</p>
        <span id="help-toggle" class="help-btn">?</span>
    </div>

    <div id="help-box" class="help-box">
        <p><b>・高速モード</b><br>処理は一瞬で終わりますが、一部のアプリ（ゲームや動画など）が稀に落ちることがあります。</p>
        <p><b>・安定モード</b><br>アプリが落ちるのを確実に防ぎますが、処理に約3秒間かかります。</p>
    </div>

    <div class="search-container">
        <input type="text" id="search" class="search-box" placeholder="アプリ名またはパッケージ名で検索...">
        <span id="search-clear" class="search-clear">&times;</span>
    </div>

    <div class="card">
        <div id="apps-list">アプリ一覧を読み込み中...</div>
    </div>

    <template id="app-template">
        <div class="app-item">
            <div class="app-info">
                <span class="label"></span>
                <span class="pkg-name"></span>
            </div>
            <select class="mode-select">
                <option value="fast">高速</option>
                <option value="stable">安定</option>
            </select>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
